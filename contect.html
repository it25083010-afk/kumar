    <div class="form-box">
            <h3>Send Me a Message</h3>

            <form action="send.php" method="post">

                <input type="text"
                       name="name"
                       placeholder="Your Name"
                       required>

                <br><br>

                <input type="email"
                       name="email"
                       placeholder="Your Email"
                       required>

                <br><br>

                <textarea name="message"
                          placeholder="Write Your Message"
                          required></textarea>

                <br><br>

                <button type="submit">Send</button>

            </form>
        </div>
    </section>
